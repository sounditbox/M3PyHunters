{% extends 'base.html' %}

{% block title %}Update post {{ post.title }} | {{ site_name }}{% endblock %}

{% block content %}

<div class="container">
    <h2>Update post</h2>
    <form action="{% url 'blog:post_update' post.id %}" method="post">
        {% csrf_token %}
         {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Update</button>
    </form>
</div>

{% endblock %}
