{% extends 'base.html' %}

{% block title %}Create new post | {{ site_name }}{% endblock %}

{% block content %}

<div class="container">
    <h2>Create new post</h2>
    <form action="{% url 'blog:post_create' %}" method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: red;">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}
<!--        {{ form.as_p }}-->
        <button class="btn btn-primary" type="submit">Create post</button>
    </form>
</div>

{% endblock %}
