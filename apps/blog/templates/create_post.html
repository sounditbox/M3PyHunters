{% extends 'base.html' %}

{% block title %}Create new post | {{ site_name }}{% endblock %}

{% block content %}

<div class="container">
    <h2>Create new post</h2>
    <form action="{% url 'blog:post_create' %}" method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="post-title">Title</label>
            <input class="form-control" id="post-title" type="text" name="title" placeholder="Title" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="post-content">Content</label>
            <textarea class="form-control" id="post-content" name="content" rows="6" placeholder="Content" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Create post</button>
    </form>
</div>

{% endblock %}
