{% extends 'base.html' %}

{% block title %}
    Create new post | {{ site_name }}
{% endblock %}

{% block content %}

<div class="container form-group">
    <h2>Create new post</h2>
    <form action="{% url 'blog:post_list' %}" class="d-flex flex-column" method="post">
        {% csrf_token %}
        <input class="m-2 form-control" type="text" name="title" placeholder="Title">
        <input class="m-2 form-control" type="text" name="content" placeholder="Content">
        <button class="btn btn-primary form-control" type="submit">Create post</button>
    </form>
</div>

{% endblock %}
