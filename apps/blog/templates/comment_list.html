{% extends 'base.html' %}

{% block content %}
<a href="{% url 'blog:post_detail' post_id %}">
    <button class="btn btn-secondary">
        Back to post
    </button>
</a>
<div class="container">
    <h2 class="display-7">Comments for post {{ post_id }}</h2>
    {% for comment in comments %}
        <p>{{ comment.content }}</p>
    {% empty %}
        <p>No comments found</p>
    {% endfor %}
</div>
{% endblock %}
