{% extends 'base.html' %}

{% block title %}
    Comments | {{ site_name }}
{% endblock %}

{% block content %}
<a href="{% url 'blog:post_detail' post_id %}">
    <button class="btn btn-secondary">
        Back to post
    </button>
</a>
<div class="container">
    <h2 class="display-7">Comments for post {{ post_id }}</h2>
    {% for comment in comments %}
        <p>{{ comment.content }}</p>
    {% empty %}
        <p>No comments found</p>
    {% endfor %}
</div>

<div class="container">
    <h2>Create new comment</h2>
    <form action="{% url 'blog:comments' post_id %}" class="d-flex flex-column" method="post">
        {% csrf_token %}
        <input class="m-2" type="text" name="content" placeholder="Content">
        <button class="btn btn-primary" type="submit">Comment</button>
    </form>
</div>

{% endblock %}
