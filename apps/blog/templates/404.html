{% extends 'base.html' %}

{% block title %}Not found | {{ site_name }}{% endblock %}

{% block content %}
<div class="container">
    <h1 class="display-5 text-danger">404 {{ instance }} Not Found</h1>
    <p class="lead">The requested page could not be found.</p>
    <a class="btn btn-primary" href="{% url 'blog:post_list' %}">Back to posts</a>
</div>
{% endblock %}
