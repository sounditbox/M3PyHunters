{% load static %}
<header class="p-3 text-bg-dark">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <div>
                <img src="{% static 'globe.svg' %}" alt="Globe" width="30"
                     height="30">
            </div>
            <div class="fs-4 ">{{ site_name }}</div>
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="{% url 'blog:post_create' %}"
                       class="nav-link px-2 text-white"><img src="{% static 'add.svg' %}" alt="Add" width="20"
                     height="20">Create</a>
                </li>

                <li><a href="{% url 'blog:post_list' %}"
                       class="nav-link px-2 text-white">Posts</a>
                </li>
                <li><a href="#" class="nav-link px-2 text-white">FAQs</a></li>
                <li><a href="#" class="nav-link px-2 text-white">About</a></li>
            </ul>
            {% if user.is_authenticated %}
                <a class="btn btn-secondary" href="#">
                    <img src="{% static 'user.svg' %}" alt="User" width="20"
                     height="20">{{ user.username }}
                </a>
                <a href="#" class="btn btn-secondary m-1">
                    Logout
                </a>
            {% else %}
                <div class="text-end">
                    <button type="button" class="btn btn-outline-light me-2">
                        Login
                    </button>
                    <button type="button" class="btn btn-secondary">
                        Sign-up
                    </button>
                </div>
            {% endif %}
        </div>
    </div>
</header>
